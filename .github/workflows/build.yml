name: Build NaoTube

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build the release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish the APK as a GitHub release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk NaoTube.apk
          gh release create "$TAG" NaoTube.apk \
            --title "NaoTube 1.0.${{ github.run_number }}" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}. Sur la TV : NaoTube se met à jour tout seul (Réglages → Mises à jour)." \
            --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Keep the build log (when the build fails)
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/build.log 2>/dev/null || echo "no log" > /tmp/ci/build.log
          grep -n -E "^e: |error:|FAILURE|What went wrong|Could not|> " /tmp/ci/build.log | head -400 > /tmp/ci/errors.txt || true
          git config user.name "naotube-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/ci/build.log /tmp/ci/errors.txt .
          git add build.log errors.txt
          git commit -m "Build log of run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f origin ci-logs

  tv-check:
    name: TV smoke test
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Download the APK that was just published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.apk.outputs.tag }}" -p NaoTube.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run NaoTube on an emulator (1080p TV screen)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke-test.sh

      - name: Publish the screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p shots
          git config user.name "naotube-ci"
          git config user.email "ci@users.noreply.github.com"
          cp -r shots /tmp/shots
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf shots && cp -r /tmp/shots shots
          git add shots
          git commit -m "Screenshots of run ${{ github.run_number }}" || true
          git push -f origin ci-shots

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Download VLC (shipped inside NaoTube)
        shell: bash
        run: |
          set -e
          BASE="https://download.videolan.org/pub/videolan/vlc/last/win64/"
          ZIP=$(curl -sL "$BASE" | grep -o 'vlc-[0-9.]*-win64\.zip' | head -1 || true)
          if [ -n "$ZIP" ]; then URL="$BASE$ZIP"; else URL="https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"; fi
          echo "VLC: $URL"
          curl -sSL --retry 3 -o vlc.zip "$URL"
          7z x -y -ovlc-tmp vlc.zip > /dev/null
          SRC=$(ls -d vlc-tmp/vlc-*)
          DEST=desktop/resources/windows/vlc
          mkdir -p "$DEST"
          cp "$SRC/libvlc.dll" "$SRC/libvlccore.dll" "$DEST/"
          cp -r "$SRC/plugins" "$DEST/"
          # Parts of VLC NaoTube never uses (its own interface, visualisations…)
          rm -rf "$DEST/plugins/gui" "$DEST/plugins/visualization" "$DEST/plugins/video_splitter"
          cp "$SRC/COPYING.txt" "$DEST/VLC-COPYING.txt" 2>/dev/null || true
          du -sh "$DEST"

      - name: Build NaoTube.exe
        shell: bash
        run: ./gradlew -p desktop createDistributable --stacktrace --console=plain 2>&1 | tee build-windows.log; test ${PIPESTATUS[0]} -eq 0

      - name: Self-test (VLC + video rendering + YouTube)
        shell: bash
        run: |
          CODE=0
          ./desktop/build/compose/binaries/main/app/NaoTube/NaoTube.exe --selftest || CODE=$?
          cat "$APPDATA/NaoTube/naotube.log" || true
          echo "selftest exit code: $CODE"
          exit $CODE

      - name: Screenshots of the app
        if: always()
        shell: pwsh
        run: ./ci/windows-smoke-test.ps1 -Exe "desktop\build\compose\binaries\main\app\NaoTube\NaoTube.exe"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "desktop\packaging\naotube.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "desktop\build\installer\NaoTube-Setup.exe" "NaoTube-Setup.exe"
          Compress-Archive -Path "desktop\build\compose\binaries\main\app\NaoTube" -DestinationPath "NaoTube-Windows.zip"
          Get-Item NaoTube-Setup.exe, NaoTube-Windows.zip | Format-Table Name, Length

      - name: Keep the Windows files for the release
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            NaoTube-Setup.exe
            NaoTube-Windows.zip
          retention-days: 3

      - name: Publish the screenshots and logs
        if: always()
        shell: bash
        run: |
          mkdir -p shots
          cp build-windows.log shots/ 2>/dev/null || true
          find . -maxdepth 6 -name "hs_err_pid*.log" -exec cp {} shots/ \; 2>/dev/null || true
          grep -n -E "^e: |error:|FAILURE|What went wrong|Could not|> " build-windows.log > shots/errors.txt 2>/dev/null || true
          git config user.name "naotube-ci"
          git config user.email "ci@users.noreply.github.com"
          cp -r shots /tmp/winshots
          git checkout --orphan ci-shots-windows
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf shots && cp -r /tmp/winshots shots
          git add -f shots
          git commit -m "Windows build ${{ github.run_number }}" || true
          git push -f origin ci-shots-windows

  windows-release:
    name: Windows release
    needs: [ apk, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Add the Windows files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.apk.outputs.tag }}" NaoTube-Setup.exe NaoTube-Windows.zip --clobber --repo "${{ github.repository }}"
